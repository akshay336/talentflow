<div class="enterprise-card fade-in-step">
  <div class="enterprise-card-header d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-1 fw-bold text-dark">Step 1: Personal & Contact Information</h4>
      <p class="text-muted small mb-0">Please provide your primary identification and contact coordinates.</p>
    </div>
    <span class="badge badge-soft-primary d-none d-sm-inline-flex align-items-center gap-1">
      <i class="bi bi-shield-lock-fill"></i> Data Confidential
    </span>
  </div>

  <div class="enterprise-card-body">
    <form [formGroup]="form" class="row g-3">
      <!-- Full Name -->
      <div class="col-md-6">
        <label for="fullName" class="form-label">
          Full Legal Name <span class="required-mark">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-person"></i>
          </span>
          <input
            id="fullName"
            type="text"
            class="form-control border-start-0"
            placeholder="e.g. Akshay Jadhav"
            formControlName="fullName"
            [class.is-invalid]="isFieldInvalid(f['fullName'])"
          />
        </div>
        <app-form-error [control]="f['fullName']" fieldName="Full Name"></app-form-error>
      </div>

      <!-- Email Address -->
      <div class="col-md-6">
        <label for="email" class="form-label">
          Corporate / Personal Email <span class="required-mark">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-envelope"></i>
          </span>
          <input
            id="email"
            type="email"
            class="form-control border-start-0"
            placeholder="e.g. akshayjadhav@gmail.com"
            formControlName="email"
            [class.is-invalid]="isFieldInvalid(f['email'])"
          />
        </div>
        <app-form-error [control]="f['email']" fieldName="Email Address"></app-form-error>
      </div>

      <!-- Phone Number -->
      <div class="col-md-6">
        <label for="phone" class="form-label">
          Contact Phone Number <span class="required-mark">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-telephone"></i>
          </span>
          <input
            id="phone"
            type="tel"
            class="form-control border-start-0"
            placeholder="e.g. +14155552671 or 9876543210"
            formControlName="phone"
            [class.is-invalid]="isFieldInvalid(f['phone'])"
          />
        </div>
        <app-form-error [control]="f['phone']" fieldName="Phone Number"></app-form-error>
      </div>

      <!-- Residential Address -->
      <div class="col-12">
        <label for="address" class="form-label">
          Residential / Mailing Address <span class="required-mark">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0 align-items-start pt-2">
            <i class="bi bi-geo-alt"></i>
          </span>
          <textarea
            id="address"
            rows="3"
            class="form-control border-start-0"
            placeholder="Street address, Apartment/Suite, City, State, ZIP Code"
            formControlName="address"
            [class.is-invalid]="isFieldInvalid(f['address'])"
          ></textarea>
        </div>
        <app-form-error [control]="f['address']" fieldName="Residential Address"></app-form-error>
      </div>
    </form>
  </div>
</div>
